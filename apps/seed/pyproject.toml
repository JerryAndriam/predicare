[project]
name = "predicare-seed"
version = "0.1.0"
description = "Chargement initial des donnees de reference et des 24 mois de factures"
requires-python = ">=3.12,<3.13"
dependencies = [
    "predicare-core",
    "pandas>=2.2.3",
    "numpy>=2.1.3",
    "pypdf>=4.0",
    "langchain-openai>=0.2",
]

[tool.uv.sources]
predicare-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predicare_seed"]