[project]
name = "predicare-inference-api"
version = "0.1.0"
description = "Flux 1 : validation d'entree, scoring XGBoost, explicabilite SHAP, suivi de derive"
requires-python = ">=3.12,<3.13"
dependencies = [
    "predicare-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pandas>=2.2.3",
    "numpy>=2.1.3",
    "scikit-learn>=1.6.0",
    "xgboost>=2.1.3",
    "shap>=0.46.0",
    "joblib>=1.4.2",
]

[tool.uv.sources]
predicare-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predicare_inference_api"]