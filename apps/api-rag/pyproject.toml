[project]
name = "predicare-rag-api"
version = "0.1.0"
description = "Flux 2 : agent ReAct LangChain, recherche pgvector, outil SQL en lecture seule, cache semantique"
requires-python = ">=3.12,<3.13"
dependencies = [
    "predicare-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "langchain>=0.3.14",
    "langchain-core>=0.3.29",
    "langchain-openai>=0.2.14",
    "langgraph>=0.2.60",
    "pgvector>=0.3.6",
    "tiktoken>=0.8.0",
    "redis>=5.2.0",
]

[tool.uv.sources]
predicare-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predicare_rag_api"]