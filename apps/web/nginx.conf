# Interface web servie par nginx.

# Racine unique servie par la passerelle : le navigateur ne voit jamais
# l'adresse d'un service interne. /api est reverse-proxye vers les trois API.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression des textes : le bundle de l'interface est repete a chaque
    # chargement par le jury pendant la demonstration.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1024;

    # Application a page unique : toute route inconnue rend index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Documentation des API : acces direct sans passer par la passerelle,
    # utile en exploitation mais jamais requis pour utiliser l'application.
    location /api {
        proxy_pass http://api-core:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Pas de cache sur les points d'entree : garantit que le jury voit
    # immediatement l'image construite, pas une copie ancienne du navigateur.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }
}