[project]
name = "predicare-ml-training"
version = "0.1.0"
description = "Feature engineering et entrainement du modele de detection de fraude (Phase 2)"
requires-python = ">=3.12,<3.13"
dependencies = [
    # La featurisation vit dans le socle partage : c'est ce qui garantit que
    # l'entrainement et l'inference produisent exactement les memes variables.
    "predicare-core",
    # Reutilise `lire_tous` et `valider_factures` : une seule implementation
    # des 10 regles d'invalidite, pas deux qui divergent.
    "predicare-seed",
    "pandas>=2.2.3",
    "numpy>=2.1.3",
    "scikit-learn>=1.6.0",
    "xgboost>=2.1.3",
    "shap>=0.46.0",
    "joblib>=1.4.2",
    "imbalanced-learn>=0.12.4",
]

[project.optional-dependencies]
# MLflow n'est PAS une dependance de base : le tracking passe par son API
# REST (httpx, deja dans le socle), donc `make train` fonctionne sans le
# profil `mlops` demarre. Ce groupe n'est utile que pour l'interface en ligne
# de commande, pas pour le job.
mlflow = ["mlflow>=2.19.0"]

[tool.uv.sources]
predicare-core = { workspace = true }
predicare-seed = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predicare_ml_training"]