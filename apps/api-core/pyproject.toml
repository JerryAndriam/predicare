[project]
name = "predicare-core-api"
version = "0.1.0"
description = "Flux 3 et socle : authentification, roles, facturation, decisions, administration"
requires-python = ">=3.12,<3.13"
dependencies = [
    "predicare-core",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "alembic>=1.14.0",
]

[tool.uv.sources]
predicare-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predicare_core_api"]