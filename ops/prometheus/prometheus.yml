# =============================================================================
# Prometheus - collecte des metriques de la plateforme PrediCare
# -----------------------------------------------------------------------------
# Les cibles sont declarees par nom de service : Prometheus resout le nom via
# le DNS interne de Docker Compose, donc aucune IP en dur a maintenir.
# =============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: predicare
    projet: PrediCare-TPA

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # ---------------------------------------------------------------- API
  - job_name: predicare-api-core
    metrics_path: /metrics
    static_configs:
      - targets: ["api-core:8001"]
        labels:
          service: api-core
          flux: socle

  - job_name: predicare-api-inference
    metrics_path: /metrics
    static_configs:
      - targets: ["api-inference:8002"]
        labels:
          service: api-inference
          flux: "1-ml"

  - job_name: predicare-api-rag
    metrics_path: /metrics
    static_configs:
      - targets: ["api-rag:8003"]
        labels:
          service: api-rag
          flux: "2-rag"

  # ------------------------------------------------------------ SANTES
  - job_name: predicare-health
    metrics_path: /health
    # /health n'est pas au format Prometheus : on l'interroge pour l'alerte
    # de disponibilite plutot que pour la collecte de series.
    static_configs:
      - targets: ["api-core:8001", "api-inference:8002", "api-rag:8003"]

  # ------------------------------------------------------- INFRASTRUCTURE
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]