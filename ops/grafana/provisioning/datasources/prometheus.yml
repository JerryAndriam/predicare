apiVersion: 1

# La source de donnees est declaree a l'installation : le tableau de bord est
# donc disponible immediatement, sans configuration manuelle a la main.
datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s