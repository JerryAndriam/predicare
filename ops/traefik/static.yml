# =============================================================================
# Passerelle - configuration statique
# -----------------------------------------------------------------------------
# Configuration declaree en fichier plutot que decouverte via le socket
# Docker. Trois raisons, toutes exploitables a la soutenance :
#
# 1. SECURITE : le conteneur n'a pas besoin de `docker.sock`. Ce socket est
#    equivalente a un acces root sur l'hote ; un routeur expose dessus
#    transformerait une faille d'interface en compromission complete.
# 2. DETERMINISME : les routes ne dependent pas de l'ordre de demarrage ni
#    du SDK du moteur Docker. Le meme fichier produit le meme routage partout.
# 3. LISIBILITE : le chemin complet demande -> service est lisible en une
#    lecture, ce qui rend le routage demonstrable devant le jury.
# =============================================================================

entryPoints:
  web:
    address: ":80"

# Les middlewares (en-tetes de securite, limitation de debit) ne sont
# VOLONTAIREMENT plus declares ici comme defaut d'entrypoint : un defaut
# s'applique a TOUS les routeurs, y compris `/bi`, et rendait le tableau de
# bord inutilisable pour deux raisons mesurees :
#
#   1. `X-Frame-Options: DENY` + `frame-ancestors 'none'` : le navigateur
#      refusait d'afficher Superset dans l'iframe de `/pilotage`
#      (« localhost n'autorise pas la connexion »).
#   2. notre `Content-Security-Policy` remplacait celle de Superset, qui
#      s'appuie sur un `nonce` par requete : ses scripts inline etaient donc
#      bloques, et le tableau se serait affiche vide meme sans l'iframe.
#
# Chaque routeur applicatif les declare desormais explicitement (voir
# `ops/traefik/dynamic.yml`) ; `/bi` reste sans ces en-tetes et conserve
# ceux, plus permissifs mais bornes a la meme origine, que Superset emet
# lui-meme.

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

api:
  dashboard: false
  insecure: false

log:
  level: INFO
  # Le journal d'acces s'active par l'option `--accesslog` : la cle
  # `log.accessLog` n'existe pas dans la configuration statique de
  # Traefik v3, qui renvoie alors "field not found" et refuse de demarrer.
