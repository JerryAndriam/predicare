# =============================================================================
# Passerelle - routage applicatif
# -----------------------------------------------------------------------------
# Une seule origine pour l'utilisateur : le navigateur ne voit jamais
# l'adresse interne d'un service, et la politique de securite (en-tetes,
# limitation de debit) s'applique a toute la plateforme sans cooperation du
# code React.
# =============================================================================

http:
  # --------------------------------------------------------------------
  # Middlewares
  # --------------------------------------------------------------------
  middlewares:
    # Superset sert ses pages a la racine (`/dashboard/...`, `/health`).
    # La passerelle expose le tableau sous `/bi` : sans retrait du prefixe,
    # Superset recoit `/bi/dashboard/...` et repond 404. Les autres routes
    # (`/api/core`) n'en ont pas besoin : leur prefixe fait partie des
    # routes de l'application.
    predicare-bi-strip:
      stripPrefix:
        prefixes:
          - /bi

    # En-tetes de securite appliques a toute la plateforme sans cooperation
    # du code React : une seule definition, aucun ecart possible entre deux
    # ecrans. Pertinent pour le cadrage RGPD et AI Act.
    predicare-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        browserXssFilter: true
        customResponseHeaders:
          X-Content-Type-Options: nosniff
          X-Frame-Options: DENY
          Permissions-Policy: "geolocation=(), microphone=(), camera=()"
          Content-Security-Policy: >-
            default-src 'self'; img-src 'self' data:;
            style-src 'self' 'unsafe-inline';
            frame-ancestors 'none'

    # Limitation de debit : le RAG appelle un LLM paye a la requete. Sans
    # plafond, un script peut epuiser le quota FinOps en quelques minutes.
    predicare-rate-limit:
      rateLimit:
        average: 60
        burst: 120
        period: 1m

  # --------------------------------------------------------------------
  # Routage
  # --------------------------------------------------------------------
  routers:
    # ---- Flux 3 et socle -------------------------------------------------
    predicare-core:
      entryPoints: [web]
      rule: "PathPrefix(`/api/core`)"
      service: predicare-core
      priority: 100
      middlewares:
        - predicare-headers
        - predicare-rate-limit

    # ---- Flux 1 : detection de fraude ------------------------------------
    predicare-inference:
      entryPoints: [web]
      rule: "PathPrefix(`/api/inference`)"
      service: predicare-inference
      priority: 100
      middlewares:
        - predicare-headers
        - predicare-rate-limit

    # ---- Flux 2 : assistant agentique ------------------------------------
    predicare-rag:
      entryPoints: [web]
      rule: "PathPrefix(`/api/rag`)"
      service: predicare-rag
      priority: 100
      middlewares:
        - predicare-headers
        - predicare-rate-limit

    # ---- Sonde de sante de la passerelle ---------------------------------
    # Priorite 200 pour gagner devant le prefixe general `/api/...`.
    # Les sondes par service restent accessibles sur leurs ports directs
    # (8002, 8003) : la passerelle ne reecrit pas les chemins, une route
    # `/health/inference` arriverait donc en `/health/inference` sur l'API
    # d'inference, qui ne sert que `/health`.
    predicare-health:
      entryPoints: [web]
      rule: "Path(`/health`)"
      service: predicare-core
      priority: 200
      middlewares:
        - predicare-headers

    # ---- Interface : tout le reste ---------------------------------------
    predicare-web:
      entryPoints: [web]
      rule: "PathPrefix(`/`)"
      service: predicare-web
      priority: 1
      middlewares:
        - predicare-headers
        - predicare-rate-limit

    # ---- Flux 3 : tableau de bord BI ------------------------------------
    # Superset est PROXYFIE par la passerelle sous `/bi` plutot que
    # d'etre ouvert sur un autre port. Deux raisons :
    #   1. l'iframe du tableau de bord est alors de MEME ORIGINE que
    #      l'application : `frame-ancestors 'self'` suffirait, et aucun tiers
    #      n'a de derogation a obtenir ;
    #   2. l'utilisateur reste sur une seule URL, ce qui est le principe
    #      affiche de la plateforme (« une seule origine »).
    # Le service n'existe que si le profil `bi` est demarre : sinon la
    # passerelle repond 502 et l'ecran affiche son repli.
    #
    # CE ROUTEUR N'A VOLONTAIREMENT PAS `predicare-headers` : Superset doit
    # garder SA politique de securite (X-Frame-Options SAMEORIGIN + CSP a
    # nonce). La notre l'ecraserait et casserait a la fois l'iframe et ses
    # scripts. Le tableau reste protege : il est de meme origine, servi
    # uniquement derriere la passerelle, et Superset exige une authentification.
    #
    # Historique, pour ne pas refaire l'erreur : ces deux middlewares etaient
    # declares en DEFAUT d'entrypoint, donc appliques ici aussi. L'iframe
    # refusait alors de s'afficher (« localhost n'autorise pas la connexion »).
    predicare-bi:
      entryPoints: [web]
      rule: "PathPrefix(`/bi`)"
      service: predicare-bi
      priority: 10
      middlewares:
        - predicare-bi-strip

    # ---- Fichiers statiques de Superset ---------------------------------
    # Son bundle webpack porte un `publicPath` FIGE a `/static/assets/` : les
    # morceaux de code charges a la demande (graphiques, editeur de tableau)
    # sont donc demandes a la racine, hors de l'espace `/bi`.
    #
    # Sans cette route, ces requetes tombaient sur l'application React, qui
    # repond `index.html` avec un code 200 : le navigateur recevait du HTML la
    # ou il attendait du JavaScript, et la page Superset restait blanche sans
    # la moindre erreur visible.
    #
    # `/static` n'est utilise par AUCUNE autre brique : l'interface sert ses
    # fichiers sous `/assets`. La route est donc sans conflit. Elle n'applique
    # ni `predicare-headers` ni `predicare-rate-limit`, pour la meme raison que
    # `/bi` : Superset doit garder ses propres en-tetes, et un tableau de bord
    # envoie beaucoup de requetes d'un coup.
    #
    # Priorite 20 : devant le fourre-tout `predicare-web` (priorite 1).
    predicare-bi-static:
      entryPoints: [web]
      rule: "PathPrefix(`/static`)"
      service: predicare-bi
      priority: 20

  services:
    predicare-core:
      loadBalancer:
        servers:
          - url: "http://api-core:8001"

    predicare-inference:
      loadBalancer:
        servers:
          - url: "http://api-inference:8002"

    predicare-rag:
      loadBalancer:
        servers:
          - url: "http://api-rag:8003"

    predicare-bi:
      loadBalancer:
        servers:
          - url: "http://superset:8088"

    predicare-web:
      loadBalancer:
        servers:
          - url: "http://web:8080"
