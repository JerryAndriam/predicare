# =============================================================================
# Overlay pilotage decisionnel : Superset connecte en lecture seule
# -----------------------------------------------------------------------------
# Demarrage : `make up-bi`
#
# Superset se connecte a PostgreSQL avec un compte en LECTURE SEULE
# (`superset_ro`) et une transaction forcee en lecture seule : conformement
# au CDC ("connecte en lecture"), l'outil de BI ne peut pas modifier une
# donnee metier, meme en cas de requete erroneous.
#
# Memoire : environ 900 Mo. C'est le service le plus lourd de la pile, d'ou
# son isolement en profil.
# =============================================================================

x-superset-env: &superset-env
  TZ: ${TZ:-Europe/Paris}
  SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-change-me-superset}
  SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
  SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-change-me-superset}
  SUPERSET_FERNET_KEY: ${SUPERSET_FERNET_KEY:-change-me-superset-fernet}
  SUPERSET_LOAD_EXAMPLES: ${SUPERSET_LOAD_EXAMPLES:-no}
  # Connexion BI : lecture seule imposee par la base ET par la session.
  # Connexion BI : c'est cette URI que `register_datasets.py` enregistre dans
  # Superset comme source unique du tableau de bord. Elle est en lecture
  # seule. Les metadonnees de Superset utilisent, elles, POSTGRES_USER sur
  # la base `superset` : voir ops/superset/superset_config.py.
  # L'option PostgreSQL `default_transaction_read_only` est portee par l'URI
  # et non par une option globale : c'est la seule maniere de la reserver a la
  # source BI, les metadonnees de Superset devant rester accessibles en
  # ecriture.
  DB_CONNECTION_STRING: postgresql+psycopg2://superset_ro:${SUPERSET_DB_RO_PASSWORD:-predicare}@db:5432/${POSTGRES_DB:-predicare}?options=-c%20default_transaction_read_only%3Don
  POSTGRES_USER: ${POSTGRES_USER:-predicare}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-predicare}
  DB_HOST: db
  DB_PORT: "5432"

services:
  superset-init:
    build:
      context: .
      dockerfile: ops/superset/Dockerfile
    image: predicare-superset:latest
    container_name: predicare-superset-init
    environment:
      <<: *superset-env
    depends_on:
      db:
        condition: service_healthy
      # La base `superset` est creee par le job de migration : sans elle,
      # `superset init` echoue sur une base inexistante.
      migrate:
        condition: service_completed_successfully
    networks:
      - core
    # Script dans un fichier plutot qu'inline : le chevauchement des
    # guillemets YAML / Compose / bash rendait une erreur silencieuse.
    command: ["/bin/bash", "/app/init.sh"]
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  superset-import:
    build:
      context: .
      dockerfile: ops/superset/Dockerfile
    image: predicare-superset:latest
    container_name: predicare-superset-import
    environment:
      <<: *superset-env
      POSTGRES_USER: ${POSTGRES_USER:-predicare}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-predicare}
      DB_HOST: db
      DB_PORT: "5432"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    networks:
      - core
    command: ["python", "/app/register_datasets.py"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Tableau de bord : job distinct, APRES que le serveur repond.
  #
  # Pourquoi pas dans `superset-import` : le job parle a Superset par son API
  # REST, donc il lui faut un serveur joignable. Or `superset` depend de
  # `superset-import` qui l'a termine : le lancer au meme moment creerait un
  # cycle, et dans le conteneur du job `localhost` designe le job lui-meme,
  # pas le serveur. D'ou un job qui attend la sante du serveur.
  # ---------------------------------------------------------------------------
  superset-dashboard:
    build:
      context: .
      dockerfile: ops/superset/Dockerfile
    image: predicare-superset:latest
    container_name: predicare-superset-dashboard
    environment:
      <<: *superset-env
      # Nom du service, pas `localhost` : depuis ce conteneur, localhost est
      # le conteneur du job.
      SUPERSET_URL: http://superset:8088
    command: ["python", "/app/register_dashboard.py"]
    # L'archive du tableau est versionnee dans le depot : le job la lit pour
    # reappliquer l'etat de reference.
    volumes:
      - ./ops/superset/dashboards:/app/dashboards
    depends_on:
      superset:
        condition: service_healthy
    networks:
      - core
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Historique SQL Lab et requetes enregistrees : le job qui les remplit.
  # ---------------------------------------------------------------------------
  superset-requetes:
    build:
      context: .
      dockerfile: ops/superset/Dockerfile
    image: predicare-superset:latest
    container_name: predicare-superset-requetes
    environment:
      <<: *superset-env
      SUPERSET_URL: http://superset:8088
      # Mot de passe du compte de demonstration, lu dans le `.env` par
      # Compose. Il n'est jamais code en dur, et jamais dans le depot.
      SUPERSET_DEMO_PASSWORD: ${SUPERSET_DEMO_PASSWORD:-}
      SUPERSET_DEMO_USERNAME: ${SUPERSET_DEMO_USERNAME:-demo}
    command: ["python", "/app/charger_requetes.py"]
    depends_on:
      superset:
        condition: service_healthy
    networks:
      - core
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Archive de l'etat du tableau de bord : le depot versionne la mise en page
  # et les filtres natifs, que le job d'enregistrement ne possede pas.
  # ---------------------------------------------------------------------------
  superset-export:
    build:
      context: .
      dockerfile: ops/superset/Dockerfile
    image: predicare-superset:latest
    container_name: predicare-superset-export
    environment:
      <<: *superset-env
      SUPERSET_URL: http://superset:8088
    command: ["python", "/app/exporter_dashboard.py", "export"]
    volumes:
      - ./ops/superset/dashboards:/app/dashboards
    depends_on:
      superset:
        condition: service_healthy
    networks:
      - core
    restart: "no"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  superset:
    build:
      context: .
      dockerfile: ops/superset/Dockerfile
    image: predicare-superset:latest
    container_name: predicare-superset
    restart: unless-stopped
    environment:
      <<: *superset-env
    ports:
      - "${SUPERSET_PORT:-8088}:8088"
    volumes:
      - supersetdata:/app/superset_home
    depends_on:
      superset-import:
        condition: service_completed_successfully
    networks:
      - core
      - edge
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 1024M
volumes:
  supersetdata: