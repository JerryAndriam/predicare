# =============================================================================
# Alembic - migrations versionnees du schema PrediCare
# La connexion n'est PAS ecrite ici : elle vient de l'environnement
# (PREDICARE_DB_URL), donc le meme fichier sert au developpement local,
# au conteneur `migrate` et a la CI.
# =============================================================================

[alembic]
script_location = db/migrations
prepend_sys_path = .
version_path_separator = os

# sqlalchemy.url est defini par env.py depuis predicare.config

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S